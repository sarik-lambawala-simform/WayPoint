# fork: SignPath signing, the Apple secrets, the MSI bundle and the updater-manifest patching are
# removed. A `v*` tag (cut from main by whoever merged the change) creates one draft release; the four matrix builds (macOS arm64,
# macOS x64, ubuntu-22.04, windows-latest) upload into it. macOS is ad-hoc signed (tauri.conf.json,
# signingIdentity "-"), not notarized; Windows is unsigned. A person publishes the draft.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  create-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7

      - name: Require the tag to match the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          case "$GITHUB_REF_NAME" in "v$VERSION"|"v$VERSION"-*) ;; *) echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $VERSION"; exit 1 ;; esac

      - name: Create the draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # FORK.md names the upstream Terax tag this build is on.
          UPSTREAM=$(sed -n 's/.*based on release tag `\(v[0-9][^`]*\)`.*/\1/p' FORK.md | head -n1)
          [ -n "$UPSTREAM" ] || { echo "::error::FORK.md does not name an upstream tag"; exit 1; }
          BODY="Built on upstream Terax $UPSTREAM (https://github.com/crynta/terax-ai/releases/tag/$UPSTREAM).

          Install notes are in the README: https://github.com/$GITHUB_REPOSITORY#install. macOS builds are ad-hoc signed and not notarized; Windows builds are unsigned. This build does not auto-update."
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" -X POST \
            -f tag_name="$GITHUB_REF_NAME" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="WayPoint $GITHUB_REF_NAME" \
            -f body="$BODY" \
            -F draft=true -F prerelease=false --jq .id)
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: create-release
    permissions:
      actions: read
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-target: ""
          - platform: windows-latest
            args: ""
            rust-target: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.rust-target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TERAX_CLI_TARGET: ${{ matrix.rust-target }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      # Strip the bundled libwayland-* libs from the AppImage so it loads the
      # host copies at runtime. The Ubuntu 22.04 build host ships libwayland
      # 1.20, but recent Mesa (Fedora 43 / Arch / Bazzite, Mesa 1.22+) needs
      # newer symbols; AppImage puts its bundled libs first on the search path,
      # so the stale copy wins and EGL fails with EGL_BAD_PARAMETER. libgdk-3
      # hard-links these three, so removing them only redirects resolution to
      # the host copy, which every GTK-capable system has. They are on the
      # AppImage excludelist for this exact reason. The repacked AppImage is
      # re-uploaded here.
      - name: Fix AppImage wayland libs
        if: matrix.platform == 'ubuntu-22.04' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          BASENAME=$(basename "$APPIMAGE")
          echo "Patching: $APPIMAGE"

          WORK=$(mktemp -d)
          cp "$APPIMAGE" "$WORK/"
          pushd "$WORK" >/dev/null
          chmod +x "./$BASENAME"
          "./$BASENAME" --appimage-extract >/dev/null

          test -x squashfs-root/usr/bin/waypoint \
            || { echo "waypoint binary missing from AppImage"; exit 1; }

          # linuxdeploy may already exclude some of these libraries.
          find squashfs-root \( -type f -o -type l \) \
            -name 'libwayland-*.so*' -print -delete

          curl -fsSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run squashfs-root "$BASENAME"

          # Sanity-check the repacked image before it replaces the original.
          rm -rf squashfs-root
          chmod +x "./$BASENAME"
          "./$BASENAME" --appimage-extract >/dev/null
          if find squashfs-root -name 'libwayland-*.so*' -print -quit | grep -q .; then
            echo "Wayland library still present after repack"
            exit 1
          fi
          test -x squashfs-root/usr/bin/waypoint \
            || { echo "waypoint binary missing from repacked AppImage"; exit 1; }
          popd >/dev/null

          cp "$WORK/$BASENAME" "$APPIMAGE"

          # Replace the asset in the draft release by id (gh release upload cannot find drafts by tag).
          RELEASE_ID="${{ needs.create-release.outputs.release_id }}"
          OLD=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq ".[] | select(.name == \"$BASENAME\") | .id")
          for id in $OLD; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
          done
          gh api -X POST -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$BASENAME" \
            --input "$APPIMAGE" >/dev/null
